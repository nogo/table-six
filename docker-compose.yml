# Table Six on the server — this file and data/, nothing else. The image is
# built by GitHub Actions on every push to main; the server never sees the
# source and never builds, it pulls:
#   docker compose pull && docker compose up -d
services:
  table-six:
    image: ghcr.io/nogo/table-six:latest
    container_name: table-six
    restart: unless-stopped
    # The kitchen's clock: the server derives "today" from the local timezone
    # (src/dates.ts), and a container is UTC unless told otherwise — without
    # this the week rolls over two hours early.
    environment:
      TZ: Europe/Berlin
      # `de` or `en` — the interface is served in one language, no switch.
      TABLE_SIX_LANG: de
    # 9000 outside, 4173 inside — the container keeps the port the app uses in
    # development, the host decides what is dialled.
    ports:
      - '9000:4173'
    # The database. Create it as uid 1000, the image's `bun` user:
    #   sudo mkdir -p data && sudo chown 1000:1000 data
    volumes:
      - ./data:/data
