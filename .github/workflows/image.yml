# The image the server pulls. Table Six has no build step, so this is
# `bun test` and then the same Dockerfile the laptop builds, pushed to the
# repository's own registry for the laptop (amd64) and the Pi (arm64).
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

# A second push to main makes the first image pointless before it is pulled.
concurrency:
  group: image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The suite is well under a second and the family pulls whatever lands
      # here, so it runs before anything is pushed, never after.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun test

      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN is the only credential — the registry belongs to the repo.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No RUN step in the Dockerfile, so arm64 is assembled, never emulated —
      # no QEMU, and the second architecture costs seconds.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
