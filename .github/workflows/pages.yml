# The showcase at nogo.github.io/table-six — three screenshots and what the app
# is, in both languages. Static files, no build: `site/` is uploaded as it lies.
name: pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

# One deploy at a time, and let a running one finish — a half-published page
# is worse than an old one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Pages is enabled on the repository itself (Settings → Pages → GitHub
      # Actions). The action's `enablement` input cannot do it from here: it
      # needs a token with more than `GITHUB_TOKEN` carries.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deploy
