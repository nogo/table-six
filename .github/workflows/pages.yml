# The showcase at nogo.github.io/table-six — three screenshots and what the app
# is, in both languages. Static files, no build: `site/` is uploaded as it lies.
name: pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

# One deploy at a time, and let a running one finish — a half-published page
# is worse than an old one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # `enablement` turns Pages on if it is off: the workflow is then the whole
      # setup, and a fresh clone of this repo does not need a click in Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy
